<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1230"/><stop offset=".62" stop-color="#18224a"/><stop offset="1" stop-color="#2a1d14"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".6" r=".42"><stop offset="0" stop-color="#ffc35a" stop-opacity=".75"/><stop offset=".45" stop-color="#f0a83a" stop-opacity=".22"/><stop offset="1" stop-color="#f0a83a" stop-opacity="0"/></radialGradient>
    <radialGradient id="moon" cx=".38" cy=".36" r=".7"><stop offset="0" stop-color="#fffdf2"/><stop offset=".7" stop-color="#eee6c8"/><stop offset="1" stop-color="#cfc59f"/></radialGradient>
    <pattern id="weave" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="22" height="22" fill="#d6b273"/><rect width="11" height="22" fill="#b98f4f"/><rect y="10" width="22" height="2" fill="#8f6a35" opacity=".35"/></pattern>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6dc95"/><stop offset=".5" stop-color="#c99a45"/><stop offset="1" stop-color="#8a6424"/></linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#fff"><circle cx="118" cy="118" r="3"/><circle cx="176" cy="78" r="2"/><circle cx="92" cy="186" r="2"/><circle cx="236" cy="132" r="2.4"/><circle cx="300" cy="86" r="1.8"/></g>
  <!-- crescent moon -->
  <mask id="cres"><rect width="512" height="512" fill="#fff"/><circle cx="394" cy="128" r="54" fill="#000"/></mask><circle cx="368" cy="146" r="62" fill="url(#moon)" mask="url(#cres)"/>
  <!-- lamp light on the mat -->
  <circle cx="256" cy="318" r="190" fill="url(#glow)"/>
  <!-- the woven mat in perspective -->
  <path d="M86 446 L150 352 H362 L426 446 Z" fill="url(#weave)"/>
  <path d="M86 446 L150 352 H362 L426 446 Z" fill="none" stroke="#9c2620" stroke-width="12" stroke-linejoin="round"/>
  <path d="M112 434 L158 366 H354 L400 434 Z" fill="none" stroke="#e9cc8b" stroke-width="3" opacity=".8"/>
  <!-- hurricane lantern -->
  <g transform="translate(256 300)">
    <path d="M-30 -122 a30 30 0 0 1 60 0" fill="none" stroke="url(#brass)" stroke-width="8" stroke-linecap="round"/>
    <rect x="-40" y="-112" width="80" height="18" rx="6" fill="url(#brass)"/>
    <path d="M-36 -94 H36 L50 -54 V-4 L36 34 H-36 L-50 -4 V-54 Z" fill="#ffe2a0" fill-opacity=".22" stroke="url(#brass)" stroke-width="6" stroke-linejoin="round"/>
    <ellipse cx="0" cy="-30" rx="34" ry="44" fill="#ffb347" opacity=".55"/>
    <path d="M0 -66 C16 -44 20 -30 10 -16 A12 12 0 0 1 -10 -16 C-20 -30 -16 -44 0 -66 Z" fill="#ffd166"/>
    <path d="M0 -44 C6 -34 7 -26 3 -20 H-3 C-7 -26 -6 -34 0 -44 Z" fill="#fff6d8"/>
    <path d="M-50 -54 L-36 -94 M50 -54 L36 -94 M-50 -4 L-36 34 M50 -4 L36 34" stroke="#d9b56a" stroke-width="5" stroke-linecap="round"/>
    <path d="M-56 34 H56 L66 54 C66 70 40 78 0 78 C-40 78 -66 70 -66 54 Z" fill="url(#brass)"/>
  </g>
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="#c99a45" stroke-width="4" opacity=".55"/>
</svg>
